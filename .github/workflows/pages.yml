name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Check source assets
        run: npm run check
      - name: Build published website
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check published routes and assets
        run: node tests/deployment.mjs
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
